name: mac-threat-hunter security

on:
  push:
    branches: [main]
    paths: ["mac-threat-hunter/**", ".github/workflows/mac-threat-hunter-*.yml"]
  pull_request:
    paths: ["mac-threat-hunter/**", ".github/workflows/mac-threat-hunter-*.yml"]
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

defaults:
  run:
    working-directory: mac-threat-hunter

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Static analysis (bandit)
        run: bandit -q -r src
      - name: Dependency vulnerabilities (pip-audit)
        run: pip-audit --strict .
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: Secret scan (gitleaks)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          echo "ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --no-git --source . --config .gitleaks.toml --no-banner --redact
