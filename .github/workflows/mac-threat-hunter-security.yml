name: mac-threat-hunter security

on:
  push:
    branches: [main]
    paths: ["mac-threat-hunter/**", ".github/workflows/mac-threat-hunter-*.yml"]
  pull_request:
    paths: ["mac-threat-hunter/**", ".github/workflows/mac-threat-hunter-*.yml"]
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

defaults:
  run:
    working-directory: mac-threat-hunter

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Static analysis (bandit)
        run: bandit -q -r src
      - name: Dependency vulnerabilities (pip-audit)
        run: pip-audit --strict
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Secret scan (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --no-banner --redact
