# Linux Threat Hunter default configuration.
# This file mirrors the built-in defaults (a test keeps them identical). Pass your own file with
# --config to override individual keys; unspecified keys keep these defaults.
# Reference: docs/configuration.md
config_version: 1
limits:
  max_evidence_file_bytes: 52428800
  max_records_per_source: 200000
  max_line_length: 4096
  max_findings_per_rule: 500
  max_rule_file_bytes: 262144
  max_regex_length: 256
  max_regex_input_chars: 4096
  max_condition_depth: 6
  max_list_values: 1000
  subprocess_timeout_seconds: 15
  subprocess_max_output_bytes: 8388608
  max_hash_file_bytes: 67108864
redaction:
  patterns:
  - (?i)((?:--?)(?:password|passwd|pass|token|secret|api[-_]?key)\s+)[^\s'\"-][^\s'\"]*
  - (?i)(\b(?:password|passwd|pwd|token|secret|api[-_]?key|access[-_]?key)=)[^\s'\"&]+
  - (?i)(authorization:\s*(?:bearer|basic)\s+)[^\s'\"]+
  - (://[^/\s:@]+:)[^@\s]+(?=@)
  - \bAKIA[0-9A-Z]{16}\b
  replacement: '[REDACTED]'
collection:
  process_hashing: true
  auth_log_paths:
  - /var/log/auth.log
  - /var/log/secure
  auth_log_max_bytes: 5242880
  journal_since: 7 days ago
  journal_max_lines: 20000
  systemd_dirs:
  - /etc/systemd/system
  - /etc/systemd/user
  - /run/systemd/system
  - /usr/local/lib/systemd/system
  systemd_vendor_dirs_full:
  - /usr/lib/systemd/system
  - /lib/systemd/system
  cron_files:
  - /etc/crontab
  cron_dirs:
  - /etc/cron.d
  - /etc/cron.hourly
  - /etc/cron.daily
  - /etc/cron.weekly
  - /etc/cron.monthly
  - /var/spool/cron/crontabs
  - /var/spool/cron
  shell_startup_files:
  - /etc/profile
  - /etc/bash.bashrc
  - /etc/zsh/zshrc
  shell_startup_dirs:
  - /etc/profile.d
  user_shell_files:
  - .bashrc
  - .profile
  - .bash_profile
  - .zshrc
  - .bash_logout
  ssh_config_files:
  - /etc/ssh/sshd_config
  ssh_config_dirs:
  - /etc/ssh/sshd_config.d
  rc_files:
  - /etc/rc.local
  - /etc/ld.so.preload
  file_integrity_paths:
  - /etc/passwd
  - /etc/group
  - /etc/sudoers
  - /etc/hosts
  - /etc/resolv.conf
  - /etc/ssh/sshd_config
  - /etc/ld.so.preload
  - /etc/crontab
  - /etc/pam.d/sshd
  - /etc/pam.d/sudo
  - /etc/pam.d/common-auth
  executable_scan_dirs:
  - /tmp
  - /var/tmp
  - /dev/shm
  executable_scan_max_entries: 500
  max_users: 200
  max_unit_bytes: 65536
  content_excerpt_bytes: 16384
variables:
  writable_dirs:
  - /tmp
  - /var/tmp
  - /dev/shm
  - /home/*/.cache
  suspicious_command_patterns:
  - (curl|wget)\s[^|;&]{0,200}\|\s*(sudo\s+)?(ba|da|z)?sh\b
  - /dev/tcp/\d{1,3}(\.\d{1,3}){3}/\d+
  - base64\s+(-d|--decode)[^|;]{0,100}\|\s*(ba|da)?sh\b
  - \bnc(at)?\s[^;|&]{0,80}\s-e\s
  sudo_suspicious_patterns:
  - ^(/usr)?/bin/(ba|da|z)?sh(\s|$)
  - ^(/usr)?/bin/su(\s|$)
  - /etc/(sudoers|shadow|passwd)\b
  shell_names:
  - sh
  - bash
  - dash
  - zsh
  - ksh
  - ash
  server_process_names:
  - nginx
  - apache2
  - httpd
  - php-fpm
  - php-fpm8.3
  - mysqld
  - postgres
  - redis-server
  security_config_dirs:
  - /etc
disabled_rules: []
rule_overrides: {}
allowlists: {}
