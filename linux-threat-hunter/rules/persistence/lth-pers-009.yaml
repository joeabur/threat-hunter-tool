# Linux Threat Hunter detection rule (schema: docs/rule-authoring.md)
id: LTH-PERS-009
name: Cron job command references a writable path
version: 1.0.0
type: match
data_source: persistence
severity: high
confidence: medium
classification: heuristic
description: A cron job command references a path under a writable location such as /tmp or /dev/shm.
rationale: Scheduled jobs that run content from writable directories can be hijacked by anyone able to
  write there and are a common staging location for payloads.
conditions:
  all:
  - field: kind
    op: equals
    value: cron_job
  - field: command
    op: text_references_path_under
    value: $writable_dirs
finding:
  title: Cron job in {path} runs a command in a writable location
  explanation: 'Line {line_no} of {path} (schedule {schedule}, user {cron_user}) runs: {command}'
  artifact: '{path}:{line_no}'
attack:
- tactic: persistence
  technique: T1053.003
false_positives:
- Jobs that only write logs or temp output to /tmp (check whether the executable itself is there).
investigation_steps:
- Check whether the referenced file exists, who owns it and its hash.
- Compare the cron file with the baseline and its mtime with change records.
- Review who can write to the cron file.
