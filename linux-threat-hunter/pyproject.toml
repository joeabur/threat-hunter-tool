[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "linux-threat-hunter"
dynamic = ["version"]
description = "Read-only Linux threat hunting: telemetry collection, transparent detection rules, IOC matching, baselines and evidence-backed reports."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Linux Threat Hunter contributors" }]
keywords = ["threat-hunting", "dfir", "linux", "detection-engineering", "mitre-attack"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Topic :: Security",
  "Intended Audience :: Information Technology",
]
dependencies = [
  "PyYAML>=6.0,<7",
  "tzdata; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "types-PyYAML", "build>=1.2"]

[project.scripts]
linux-threat-hunter = "linux_threat_hunter.cli:main"

[tool.hatch.version]
path = "src/linux_threat_hunter/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/linux_threat_hunter"]

[tool.hatch.build.targets.wheel.force-include]
"rules" = "linux_threat_hunter/_rules"

[tool.hatch.build.targets.sdist]
include = ["src", "rules", "configs", "examples", "tests", "docs", "scripts", "*.md", "LICENSE", "pyproject.toml", "requirements-dev.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["linux_only: requires a Linux host (skipped elsewhere)"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM"]
ignore = ["S101", "S603", "S607", "E501", "S108", "S104"]  # S108/S104: /tmp and 0.0.0.0 are detection data, not usage

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true
