id: MTH-SCRIPT-004
name: Quarantine attribute removal
version: 1
type: pattern
source: [process, log, persistence]
description: >-
  A command removes the com.apple.quarantine extended attribute, or clears all extended
  attributes, from a file.
rationale: >-
  The quarantine attribute causes Gatekeeper to check downloaded files. Removing it lets
  unsigned or unnotarised downloads run without that check.
severity: medium
confidence: medium
title: "Quarantine attribute removal in {source}"
requires: [search_text]
conditions:
  any:
    - {field: search_text, op: regex, value: 'xattr\s+-d\s+com\.apple\.quarantine'}
    - {field: search_text, op: regex, value: 'xattr\s+-[a-z]*r[a-z]*d\s+com\.apple\.quarantine'}
    - {field: search_text, op: regex, value: 'xattr\s+-c[a-z]*\s'}
evidence_fields: [name, process, path, pid, user, search_text, parent_name]
attack:
  techniques: [T1553.001]
  justification: >-
    Stripping the quarantine attribute is the documented way to bypass Gatekeeper checks on
    downloaded files.
false_positives:
  - Developers and power users clearing quarantine on trusted downloaded apps.
  - Software deployment scripts for internally distributed applications.
investigation:
  - Identify which file lost its quarantine flag and how it was downloaded.
  - Check the file's signature, notarisation status and hash.
references:
  - https://attack.mitre.org/techniques/T1553/001/
