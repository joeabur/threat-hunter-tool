[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "mac-threat-hunter"
version = "0.1.0"
description = "Read-only, explainable threat hunting for authorized macOS endpoints and offline evidence."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["PyYAML>=6.0,<7"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML",
  "jsonschema>=4",
  "build>=1",
  "pip-audit",
  "bandit",
]

[project.scripts]
mac-threat-hunter = "mac_threat_hunter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mac_threat_hunter"]

[tool.hatch.build.targets.wheel.force-include]
"rules" = "mac_threat_hunter/_data/rules"
"configs" = "mac_threat_hunter/_data/configs"
"schemas" = "mac_threat_hunter/_data/schemas"

[tool.hatch.build.targets.sdist]
include = ["src", "rules", "configs", "schemas", "examples", "docs", "scripts", "tests", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "macos: integration tests that only run on macOS",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM"]
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011", "E501", "C408", "SIM117", "B017"]
"scripts/**" = ["S", "E501"]
"src/mac_threat_hunter/utils/proc.py" = ["S404", "S603"]
"src/mac_threat_hunter/collectors/*.py" = ["S603"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
warn_unused_ignores = true
